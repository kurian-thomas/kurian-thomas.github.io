<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <script>
      (() => {
        try {
          const savedTheme = sessionStorage.getItem("nova-blog-theme");
          if (savedTheme) {
            document.documentElement.setAttribute("data-theme", savedTheme);
          }
        } catch (_) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="theme-picker" data-theme-picker>
      <button class="theme-toggle-btn" type="button" aria-label="Open theme picker" data-theme-toggle>
        <svg
          aria-hidden="true"
          class="theme-icon"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M12 3C7.03 3 3 6.58 3 11c0 2.04.94 3.9 2.5 5.31.56.5.89 1.22.89 1.97V20a1 1 0 0 0 1 1h1.41a2 2 0 0 0 1.41-.59l.34-.34a2 2 0 0 1 1.41-.59H13a8 8 0 1 0-1-16Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="7.5" cy="11.5" r="1.1" fill="currentColor" />
          <circle cx="10.5" cy="8.5" r="1.1" fill="currentColor" />
          <circle cx="14.2" cy="8.4" r="1.1" fill="currentColor" />
          <circle cx="16.8" cy="11.4" r="1.1" fill="currentColor" />
        </svg>
      </button>
      <div class="theme-dropdown" hidden data-theme-dropdown>
        <label class="theme-label" for="theme-select">Theme</label>
        <input
          id="theme-search"
          class="theme-search"
          type="search"
          placeholder="Search theme..."
          autocomplete="off"
          data-theme-search
        />
        <select id="theme-select" size="10" data-theme-select>
          <option value="everforest">Everforest</option>
          <option value="everforest-soft">Everforest Soft</option>
          <option value="everforest-hard">Everforest Hard</option>
          <option value="gruvbox">Gruvbox</option>
          <option value="gruvbox-material">Gruvbox Material</option>
          <option value="tokyonight">Tokyonight</option>
          <option value="tokyonight-storm">Tokyonight Storm</option>
          <option value="tokyonight-moon">Tokyonight Moon</option>
          <option value="catppuccin-mocha">Catppuccin Mocha</option>
          <option value="catppuccin-macchiato">Catppuccin Macchiato</option>
          <option value="catppuccin-frappe">Catppuccin Frappe</option>
          <option value="catppuccin-latte">Catppuccin Latte</option>
          <option value="nord">Nord</option>
          <option value="nordic">Nordic</option>
          <option value="onedark">One Dark</option>
          <option value="dracula">Dracula</option>
          <option value="kanagawa">Kanagawa</option>
          <option value="kanagawa-wave">Kanagawa Wave</option>
          <option value="kanagawa-dragon">Kanagawa Dragon</option>
          <option value="kanagawa-lotus">Kanagawa Lotus</option>
          <option value="rose-pine">Rose Pine</option>
          <option value="rose-pine-moon">Rose Pine Moon</option>
          <option value="rose-pine-dawn">Rose Pine Dawn</option>
          <option value="nightfox">Nightfox</option>
          <option value="duskfox">Duskfox</option>
          <option value="nordfox">Nordfox</option>
          <option value="terafox">Terafox</option>
          <option value="carbonfox">Carbonfox</option>
          <option value="github-dark">Github Dark</option>
          <option value="github-light">Github Light</option>
          <option value="material">Material</option>
          <option value="papercolor">PaperColor</option>
          <option value="ayu-dark">Ayu Dark</option>
          <option value="ayu-light">Ayu Light</option>
          <option value="solarized-dark">Solarized Dark</option>
          <option value="solarized-light">Solarized Light</option>
          <option value="habamax">Habamax</option>
          <option value="elflord">Elflord</option>
          <option value="industry">Industry</option>
          <option value="murphy">Murphy</option>
          <option value="pablo">Pablo</option>
          <option value="ron">Ron</option>
          <option value="slate">Slate</option>
          <option value="torte">Torte</option>
          <option value="vim">Vim</option>
        </select>
      </div>
    </div>
    <main class="container">{{ block "main" . }}{{ end }}</main>
    <script>
      (() => {
        const root = document.documentElement;
        const picker = document.querySelector("[data-theme-picker]");
        const toggle = document.querySelector("[data-theme-toggle]");
        const dropdown = document.querySelector("[data-theme-dropdown]");
        const search = document.querySelector("[data-theme-search]");
        const select = document.querySelector("[data-theme-select]");
        if (!picker || !toggle || !dropdown || !select || !search) return;

        const storageKey = "nova-blog-theme";
        const activeTheme = root.getAttribute("data-theme") || "everforest";
        select.value = activeTheme;

        const filterThemes = () => {
          const query = search.value.trim().toLowerCase();
          for (const option of select.options) {
            const label = option.text.toLowerCase();
            const match = !query || label.includes(query);
            option.hidden = !match;
          }
        };

        const closeDropdown = () => {
          dropdown.hidden = true;
          toggle.setAttribute("aria-expanded", "false");
        };

        const openDropdown = () => {
          dropdown.hidden = false;
          toggle.setAttribute("aria-expanded", "true");
          filterThemes();
          search.focus();
          search.select();
        };

        toggle.setAttribute("aria-expanded", "false");
        toggle.addEventListener("click", () => {
          if (dropdown.hidden) openDropdown();
          else closeDropdown();
        });

        select.addEventListener("change", () => {
          const nextTheme = select.value;
          root.setAttribute("data-theme", nextTheme);
          try {
            sessionStorage.setItem(storageKey, nextTheme);
          } catch (_) {}
        });

        search.addEventListener("input", filterThemes);

        document.addEventListener("click", (event) => {
          if (!picker.contains(event.target)) closeDropdown();
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closeDropdown();
        });
      })();
    </script>
  </body>
</html>
